[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "librepcb-mcp"
version = "0.1.0"
description = "Model Context Protocol server for LibrePCB projects (Linux, native, no GUI automation)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.12"
authors = [{ name = "arcbaseproject" }]
keywords = ["librepcb", "mcp", "pcb", "eda", "claude"]
classifiers = [
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
librepcb-mcp = "librepcb_mcp.server:main"

[project.urls]
Repository = "https://github.com/arcbaseproject/librepcb-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/librepcb_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["cli: needs librepcb-cli", "library: needs LibrePCB_Base.lplib"]

[tool.ruff]
line-length = 125
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
